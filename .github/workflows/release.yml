name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fxq "mod_version=${version}" gradle.properties

      - name: Build release JAR
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean :fabric:build

      - name: Create SHA-256 checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          jar="hugoutils-${version}.jar"
          test -f "fabric/build/libs/${jar}"
          cd fabric/build/libs
          sha256sum "${jar}" > ../../../SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "fabric/build/libs/hugoutils-${version}.jar" \
            "SHA256SUMS.txt" \
            --verify-tag \
            --generate-notes \
            --title "HugoUtils ${version}"
