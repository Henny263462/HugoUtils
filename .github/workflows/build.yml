name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 21 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build on Linux
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon clean :fabric:build

      - name: Build on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon clean :fabric:build

      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: hugoutils-${{ runner.os }}
          path: |
            fabric/build/libs/hugoutils-*.jar
            !fabric/build/libs/hugoutils-*-sources.jar
          if-no-files-found: error
          retention-days: 14
